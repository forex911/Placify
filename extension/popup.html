<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=380" />
  <title>Placify — Quick Save</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="popup-brand">
        <div class="popup-logo">P</div>
        <div>
          <h1 class="popup-title">Placify</h1>
          <p class="popup-subtitle">Quick Save Application</p>
        </div>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
    </header>

    <!-- Status Banner (hidden by default) -->
    <div id="status-banner" class="status-banner hidden">
      <span id="status-icon"></span>
      <span id="status-text"></span>
    </div>

    <!-- No Config Warning -->
    <div id="no-config" class="no-config hidden">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <p>Please configure your <strong>API Key</strong> in extension settings first.</p>
      <button id="open-settings" class="btn btn-primary btn-sm">Open Settings</button>
    </div>

    <!-- Tabs -->
    <div class="tabs-container hidden" id="tabs-container">
      <div class="tab active" data-tab="job">Job</div>
      <div class="tab" data-tab="hackathon">Hackathon</div>
    </div>

    <!-- Forms Container -->
    <div id="forms-container">
      <!-- Job Form -->
      <form id="save-job-form" class="popup-form">
        <div class="form-group">
          <label for="company">Company Name <span class="required">*</span></label>
          <input type="text" id="company" placeholder="e.g. Google" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="role">Role <span class="required">*</span></label>
          <input type="text" id="role" placeholder="e.g. Software Engineer Intern" required autocomplete="off" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Bangalore" autocomplete="off" />
          </div>
        </div>
        <div class="form-group">
          <label for="job-link">Job Link</label>
          <input type="url" id="job-link" placeholder="Auto-filled from current tab" autocomplete="off" />
        </div>
        <button type="submit" id="save-job-btn" class="btn btn-primary">
          <span id="btn-job-text">Save Application</span>
          <span id="btn-job-loader" class="loader hidden"></span>
        </button>
      </form>

      <!-- Hackathon Form -->
      <form id="save-hackathon-form" class="popup-form hidden">
        <div class="form-group">
          <label for="hackathon-name">Hackathon Name <span class="required">*</span></label>
          <input type="text" id="hackathon-name" placeholder="e.g. SIH 2024" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="project-title">Project Title <span class="required">*</span></label>
          <input type="text" id="project-title" placeholder="e.g. Placify App" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="hackathon-link">Project Link</label>
          <input type="url" id="hackathon-link" placeholder="Auto-filled from current tab" autocomplete="off" />
        </div>
        <button type="submit" id="save-hackathon-btn" class="btn btn-primary">
          <span id="btn-hackathon-text">Save Hackathon</span>
          <span id="btn-hackathon-loader" class="loader hidden"></span>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>Placify Extension v1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
