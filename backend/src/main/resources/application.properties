# Server Configuration
server.port=${PORT:8081}

# Application Name
spring.application.name=placify-backend

# PostgreSQL Configuration (Neon or local)
# Provide these via environment variables in your deployment (e.g. Render, Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=60000

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate: Hibernate checks schema but does NOT alter it (Flyway owns schema changes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson date format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.placify=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# â”€â”€ Flyway Configuration â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Location of migration scripts
spring.flyway.locations=classpath:db/migration
# IMPORTANT: baseline existing DB so Flyway doesn't fail on already-present tables
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Allow migrations to run out of order if needed
spring.flyway.out-of-order=false
